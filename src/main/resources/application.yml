spring:
  application:
    name: nfse
  datasource:
    url: jdbc:postgresql://localhost:5432/nfse
    username: nfse
    password: nfse
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc.time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    br.com.alvexustech.nfse: INFO

nfse:
  municipio:
    codigo-ibge: "3106200"
    nome: "Belo Horizonte"
    uf: "MG"
  certificate:
    # Em producao, prefira secret manager/volume Docker e nunca commitar o .pfx.
    pfx-path: ${NFSE_CERTIFICATE_PFX_PATH:./certs/certificado-a1.pfx}
    password: ${NFSE_CERTIFICATE_PASSWORD:changeit}
    alias: ${NFSE_CERTIFICATE_ALIAS:}
  national-api:
    # Ajuste conforme o ambiente oficial vigente do Portal Nacional/ADN.
    base-url: ${NFSE_NATIONAL_API_BASE_URL:https://adn.producaorestrita.nfse.gov.br/contribuintes}
    emission-path: "/nfse"
    status-path-template: "/nfse/{chaveAcesso}"
    dps-path-template: "/dps/{idDps}"
    connect-timeout: 10s
    response-timeout: 30s
    max-in-memory-size: 2MB
  emission:
    default-provider: nacional
    # 1=producao, 2=producao restrita/homologacao, conforme leiaute oficial vigente.
    ambiente-codigo: "2"
    idempotency-window: 24h
    schema-path: xsd/nfse-v1.01/DPS_v1.01.xsd
    leiaute-versao: "1.01"
    versao-aplicativo: "alvexus-nfse-1.0"
    serie-dps: "10000"
    # Ajuste estes codigos conforme o cadastro/regime real do prestador.
    optante-simples-nacional: "3"
    regime-ap-tributacao-simples-nacional: "1"
    regime-especial-tributario: "0"
    tributacao-issqn: "1"
    tipo-retencao-issqn: "1"
    indicador-total-tributos: "15.50"
